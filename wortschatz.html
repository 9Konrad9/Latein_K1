<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Latein-Arena · Kursstufe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#161d18; --bg-panel:#1f2b22;
    --bronze-1:#3d4a3a; --bronze-2:#5c6b4f;
    --gold:#c9a961; --parchment:#e9e2d0; --parchment-dim:#a9a894;
    --stage-red:#b5533c; --stage-yellow:#c9a961; --stage-green:#6b8f5c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100dvh;
    background:
      radial-gradient(ellipse at 20% -10%, #24322650 0%, transparent 55%),
      radial-gradient(ellipse at 100% 100%, #2a1f1650 0%, transparent 50%),
      var(--bg-deep);
    color:var(--parchment); font-family:'Crimson Pro', serif;
    display:flex; flex-direction:column; align-items:center;
    padding:clamp(12px,3vh,32px) clamp(10px,3vw,16px) clamp(20px,5vh,60px);
  }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--parchment-dim); margin-bottom:6px; }
  h1{ font-family:'Cinzel', serif; font-weight:700; font-size:clamp(26px,4.5vw,44px);
    letter-spacing:.03em; margin:0 0 6px; text-align:center; }
  .subcount{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--parchment-dim); margin-bottom:16px; }

  .daily-goal{
    display:flex; align-items:center; gap:10px; margin-bottom:16px;
    width:clamp(320px, 55vw, 720px); flex-wrap:wrap; justify-content:center;
  }
  .daily-goal-text{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--parchment-dim);
    white-space:nowrap;
  }
  .daily-goal-bar{
    flex:1; min-width:120px; height:8px; border-radius:4px; background:#00000040;
    overflow:hidden; border:1px solid #ffffff14;
  }
  .daily-goal-fill{
    height:100%; background:linear-gradient(90deg, var(--stage-red), var(--stage-yellow), var(--stage-green));
    transition:width .4s ease;
  }
  .daily-goal.reached .daily-goal-text{ color:var(--stage-green); }
  #goalSelect{ font-size:10px; padding:4px 8px; }

  .modtabs{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; justify-content:center; }
  .modtab{
    font-family:'JetBrains Mono', monospace; font-size:12px; padding:8px 16px;
    border-radius:20px; border:1px solid #ffffff20; background:#00000030;
    color:var(--parchment-dim); cursor:pointer; transition:all .2s;
  }
  .modtab.active{ background:var(--bronze-2); color:#fff; border-color:var(--bronze-2); }

  .filterbar{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; justify-content:center; }
  select{
    font-family:'JetBrains Mono', monospace; font-size:12px; padding:8px 12px;
    border-radius:8px; border:1px solid #ffffff20; background:#00000030; color:var(--parchment);
  }
  select option{ background:#1f2b22; color:var(--parchment); }
  .worst-btn{
    font-family:'JetBrains Mono', monospace; font-size:12px; padding:8px 12px;
    border-radius:8px; border:1px solid var(--stage-red); background:#00000030;
    color:var(--stage-red); cursor:pointer;
  }
  .worst-btn.active{ background:var(--stage-red); color:#fff; }

  .uebung-tabs{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; justify-content:center; }
  .uebung-tab{
    font-family:'JetBrains Mono', monospace; font-size:12px; padding:8px 16px;
    border-radius:20px; border:1px solid #ffffff20; background:#00000030;
    color:var(--parchment-dim); cursor:pointer; transition:all .2s;
  }
  .uebung-tab.active{ background:var(--bronze-2); color:#fff; border-color:var(--bronze-2); }

  .mc-options{ display:flex; flex-direction:column; gap:10px; width:clamp(320px,55vw,720px); margin-bottom:14px; }
  .mc-btn{
    font-family:'Crimson Pro', serif; font-size:clamp(15px,2vw,18px); padding:14px 18px;
    border-radius:10px; border:1px solid #ffffff20; background:#00000030; color:var(--parchment);
    cursor:pointer; text-align:left; transition:background .15s, transform .1s, border-color .15s;
  }
  .mc-btn:hover{ background:#ffffff10; }
  .mc-btn.correct{ border-color:var(--stage-green); background:#6b8f5c30; }
  .mc-btn.wrong{ border-color:var(--stage-red); background:#b5533c30; }
  .mc-btn:disabled{ cursor:default; }

  .stage-bar{ display:flex; gap:10px; margin-bottom:22px; font-family:'JetBrains Mono', monospace; font-size:12px; }
  .stage-chip{ display:flex; align-items:center; gap:6px; padding:5px 10px; border-radius:20px;
    background:#00000030; border:1px solid #ffffff14; color:var(--parchment-dim); }
  .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }

  .arena{ position:relative; width:clamp(320px, 55vw, 720px); height:clamp(220px, 42vh, 420px);
    perspective:1400px; margin-bottom:clamp(12px,3vh,22px); }
  .card{ position:absolute; inset:0; cursor:pointer; transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.2,.8,.2,1); }
  .card.flipped{ transform:rotateY(180deg); }
  .card.no-flip{ cursor:default; }
  .face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:clamp(14px,4vw,22px); text-align:center; border:1px solid #ffffff1a;
    box-shadow:0 20px 50px -20px #000000aa, inset 0 1px 0 #ffffff10; }
  .face.front{ background:linear-gradient(155deg, var(--bronze-2), var(--bronze-1) 70%);
    border-radius:14px 34px 14px 34px; }
  .face.back{ background:linear-gradient(155deg, #2a241a, #1c1712 70%);
    transform:rotateY(180deg); border-radius:34px 14px 34px 14px; }
  .latin-word{ font-family:'Crimson Pro', serif; font-weight:700; font-size:clamp(28px,4vw,48px);
    letter-spacing:.01em; color:var(--parchment); text-transform:none; }
  .meta-tag{ font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--parchment-dim);
    margin-top:10px; letter-spacing:.04em; }
  .back-gram{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--parchment-dim);
    letter-spacing:.02em; margin-bottom:8px; }
  .back-bed{ font-size:clamp(19px,3vw,32px); line-height:1.35; color:var(--gold);
    max-height:clamp(100px,25vh,220px); overflow-y:auto; }
  .back-kapitel{ font-family:'JetBrains Mono', monospace; font-size:10px; color:#ffffff55;
    margin-top:12px; }
  .hint{ position:absolute; bottom:10px; font-family:'JetBrains Mono', monospace; font-size:10px; color:#00000055; }
  .face.back .hint{ color:#ffffff33; }

  .rate-prompt{ font-family:'Crimson Pro', serif; font-style:italic; font-size:14px;
    color:var(--parchment-dim); margin:0 0 10px; text-align:center; }
  .controls{ display:flex; gap:10px; margin-bottom:8px; }
  button{ font-family:'JetBrains Mono', monospace; font-size:clamp(12px,1.4vw,15px); padding:clamp(9px,1.2vw,13px) clamp(16px,2vw,22px);
    border-radius:8px; border:1px solid #ffffff20; background:#00000030; color:var(--parchment);
    cursor:pointer; transition:background .2s, transform .15s; }
  button:hover{ background:#ffffff10; transform:translateY(-1px); }
  button.again{ border-color:var(--stage-red); color:var(--stage-red); }
  button.hard{ border-color:var(--stage-yellow); color:var(--stage-yellow); }
  button.good{ border-color:var(--stage-green); color:var(--stage-green); }

  .footer-note{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--parchment-dim);
    margin-top:16px; text-align:center; max-width:460px; line-height:1.6; }
  .counter{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--parchment-dim); margin-bottom:6px; }
</style>
</head>
<body>

  <a href="./index.html" style="align-self:flex-start; color:var(--parchment-dim); font-family:'JetBrains Mono', monospace; font-size:11px; text-decoration:none; margin-bottom:10px;">← Übersicht</a>
  <div class="eyebrow">Latein-Arena · Kursstufe-Modul</div>
  <h1>Vocābula K1</h1>
  <div class="subcount" id="totalCount"></div>

  <div class="daily-goal" id="dailyGoal">
    <div class="daily-goal-text" id="dailyGoalText">Heute: 0 / 20 Karten</div>
    <div class="daily-goal-bar"><div class="daily-goal-fill" id="dailyGoalFill" style="width:0%"></div></div>
    <select id="goalSelect" title="Tagesziel anpassen">
      <option value="10">Ziel: 10/Tag</option>
      <option value="20" selected>Ziel: 20/Tag</option>
      <option value="30">Ziel: 30/Tag</option>
      <option value="50">Ziel: 50/Tag</option>
    </select>
  </div>

  <div class="modtabs">
    <div class="modtab active" data-mod="grundwortschatz">Grundwortschatz</div>
    <div class="modtab" data-mod="autor_cicero">Cicero</div>
    <div class="modtab" data-mod="autor_ovid">Ovid: Metamorphosen</div>
  </div>

  <div class="filterbar" id="filterbar">
    <select id="waFilter">
      <option value="alle">Alle Wortarten</option>
      <option value="verben">Verben</option>
      <option value="substantive">Substantive</option>
      <option value="adjektive">Adjektive</option>
      <option value="pronomina">Pronomina</option>
      <option value="konjunktionen">Konjunktionen</option>
      <option value="subjunktionen">Subjunktionen</option>
      <option value="adverbien">Adverbien</option>
      <option value="praepositionen">Präpositionen</option>
      <option value="fragewoerter">Fragewörter</option>
      <option value="zahlwoerter">Zahlwörter</option>
    </select>
    <button id="worstBtn" class="worst-btn">🔥 Worst-of-10</button>
  </div>

  <div class="uebung-tabs">
    <div class="uebung-tab active" data-modus="karten">Karten</div>
    <div class="uebung-tab" data-modus="mc">Multiple Choice</div>
  </div>

  <div class="stage-bar" id="stageBar"></div>
  <div class="counter" id="counter">1 / 1</div>

  <div id="kartenView">
    <div class="arena">
      <div class="card" id="card">
        <div class="face front">
          <div class="latin-word" id="latinWord">—</div>
          <div class="meta-tag" id="wortartTag">—</div>
          <div class="hint">antippen zum Wenden</div>
        </div>
        <div class="face back">
          <div class="back-gram" id="backGram">—</div>
          <div class="back-bed" id="backBed">—</div>
          <div class="back-kapitel" id="backKapitel">—</div>
        </div>
      </div>
    </div>

    <p class="rate-prompt" id="ratePrompt" style="visibility:hidden">Wie gut wusstest du die Antwort?</p>
    <div class="controls" id="controls" style="visibility:hidden">
      <button class="again" onclick="rate(0)">🔴 nochmal</button>
      <button class="hard" onclick="rate(1)">🟡 wackelig</button>
      <button class="good" onclick="rate(2)">🟢 sicher</button>
    </div>
  </div>

  <div id="mcView" style="display:none">
    <div class="arena" style="height:clamp(140px,20vh,180px); margin-bottom:14px;">
      <div class="card no-flip" id="mcCard">
        <div class="face front" style="position:relative; transform:none;">
          <div class="latin-word" id="mcWord">—</div>
          <div class="meta-tag" id="mcWortartTag">—</div>
        </div>
      </div>
    </div>
    <div class="mc-options" id="mcOptions"></div>
  </div>

  <p class="footer-note">
    <a href="#" id="resetLink" style="color:var(--parchment-dim);">Fortschritt zurücksetzen</a>
  </p>

<script>
  let ALL_WORDS = [];

  async function loadWordData(){
    try {
      const res = await fetch('./wortschatz-daten.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      ALL_WORDS = await res.json();
      initAfterLoad();
    } catch (err) {
      document.getElementById('latinWord').textContent = "⚠ Wortschatz nicht geladen";
      document.getElementById('totalCount').textContent =
        "wortschatz-daten.json konnte nicht geladen werden — Datei muss im selben Ordner liegen " +
        "und über einen Webserver aufgerufen werden (nicht per Doppelklick/file://). " +
        "Lokal z. B. mit: python3 -m http.server";
      console.error(err);
    }
  }

  // --- Tagesziel ---
  const DAILY_KEY = "latein-arena-kursstufe-tagesstatistik";
  let dailyStats = { date: "", count: 0, goal: 20 };

  function todayStr(){
    const d = new Date();
    return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  }
  function loadDailyStats(){
    try {
      const raw = localStorage.getItem(DAILY_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      if (parsed && parsed.date === todayStr()) return parsed;
      // neuer Tag (oder erster Start) -> Zähler zurücksetzen, Ziel behalten falls vorhanden
      return { date: todayStr(), count: 0, goal: parsed ? parsed.goal : 20 };
    } catch(e) { return { date: todayStr(), count: 0, goal: 20 }; }
  }
  function saveDailyStats(){
    try { localStorage.setItem(DAILY_KEY, JSON.stringify(dailyStats)); } catch(e) {}
  }
  function renderDailyGoal(){
    const pct = Math.min(100, Math.round((dailyStats.count / dailyStats.goal) * 100));
    document.getElementById('dailyGoalFill').style.width = pct + '%';
    const box = document.getElementById('dailyGoal');
    if (dailyStats.count >= dailyStats.goal){
      box.classList.add('reached');
      document.getElementById('dailyGoalText').textContent =
        `🎉 Tagesziel erreicht: ${dailyStats.count} / ${dailyStats.goal} Karten`;
    } else {
      box.classList.remove('reached');
      document.getElementById('dailyGoalText').textContent =
        `Heute: ${dailyStats.count} / ${dailyStats.goal} Karten`;
    }
  }
  document.getElementById('goalSelect').addEventListener('change', (e) => {
    dailyStats.goal = parseInt(e.target.value, 10);
    saveDailyStats();
    renderDailyGoal();
  });

  const WA_LABELS = {
    verben: "Verb", substantive: "Substantiv", adjektive: "Adjektiv",
    pronomina: "Pronomen", konjunktionen: "Konjunktion", subjunktionen: "Subjunktion",
    adverbien: "Adverb", praepositionen: "Präposition", fragewoerter: "Fragewort",
    zahlwoerter: "Zahlwort"
  };

  let currentMod = "grundwortschatz";
  let currentWa = "alle";
  let pool = [];
  let currentWord = null;
  let lastWordId = null;
  let seenCount = 0;
  let worstMode = false;
  let progress = {};
  let currentUebungsmodus = "karten";
  let STORAGE_KEY = "latein-arena-kursstufe-fortschritt";

  // Leitner-Gewichtung: rote Karten (Stufe 0) erscheinen am häufigsten, gelbe (1-2)
  // mittel, grüne (3-4) am seltensten -- aber nie ganz raus, damit Wissen auffrischt.
  function stageWeight(stage){
    if (stage === 0) return 6;
    if (stage <= 2) return 3;
    return 1;
  }

  function pickNext(){
    if (pool.length === 0) return null;
    let candidates = pool;
    if (pool.length > 1 && lastWordId !== null){
      const filtered = pool.filter(w => w.id !== lastWordId);
      if (filtered.length > 0) candidates = filtered;
    }
    if (worstMode){
      // Worst-of: einfache Rotation ohne Gewichtung, es sind ja schon die schlechtesten
      return candidates[Math.floor(Math.random() * candidates.length)];
    }
    const totalWeight = candidates.reduce((sum, w) => sum + stageWeight(w.stage), 0);
    let r = Math.random() * totalWeight;
    for (const w of candidates){
      r -= stageWeight(w.stage);
      if (r <= 0) return w;
    }
    return candidates[candidates.length - 1];
  }

  function filteredByUI(){
    return ALL_WORDS.filter(w => {
      if (w.typ !== currentMod) return false;
      if (currentWa !== "alle" && w.waGroup !== currentWa) return false;
      return true;
    });
  }

  function rebuildPool(){
    worstMode = false;
    document.getElementById('worstBtn').textContent = "🔥 Worst-of-10";
    document.getElementById('worstBtn').classList.remove('active');
    pool = filteredByUI();
    lastWordId = null;
    seenCount = 0;
    showCard();
  }

  function enterWorstMode(){
    const reviewed = filteredByUI().filter(w => progress[w.id] !== undefined);
    if (reviewed.length === 0){
      alert("Für den aktuellen Filter gibt es noch keine geübten Wörter. Erst ein paar Karten bewerten, dann steht hier eine Worst-of-Liste bereit.");
      return;
    }
    reviewed.sort((a, b) => a.stage - b.stage);
    pool = reviewed.slice(0, 10);
    worstMode = true;
    document.getElementById('worstBtn').textContent = "← Zurück zum normalen Modus";
    document.getElementById('worstBtn').classList.add('active');
    lastWordId = null;
    seenCount = 0;
    showCard();
  }

  function renderStageBar(){
    const bar = document.getElementById('stageBar');
    const counts = [0,0,0,0,0];
    pool.forEach(w => counts[w.stage]++);
    const red = counts[0], yellow = counts[1]+counts[2], green = counts[3]+counts[4];
    bar.innerHTML = `
      <div class="stage-chip"><span class="dot" style="background:var(--stage-red)"></span>${red}</div>
      <div class="stage-chip"><span class="dot" style="background:var(--stage-yellow)"></span>${yellow}</div>
      <div class="stage-chip"><span class="dot" style="background:var(--stage-green)"></span>${green}</div>
    `;
  }

  function showCard(){
    if (pool.length === 0){
      currentWord = null;
      document.getElementById('latinWord').textContent = "— keine Wörter —";
      document.getElementById('wortartTag').textContent = "";
      document.getElementById('mcWord').textContent = "— keine Wörter —";
      document.getElementById('mcWortartTag').textContent = "";
      document.getElementById('mcOptions').innerHTML = '';
      document.getElementById('controls').style.visibility = 'hidden';
      document.getElementById('ratePrompt').style.visibility = 'hidden';
      document.getElementById('counter').textContent = "0 Wörter";
      renderStageBar();
      return;
    }
    currentWord = pickNext();
    seenCount++;
    document.getElementById('counter').textContent = worstMode
      ? `Worst-of · ${seenCount}. Karte`
      : `${seenCount}. Karte · ${pool.length} Wörter im Pool`;
    renderStageBar();
    if (currentUebungsmodus === "mc") renderMC();
    else renderKarte();
  }

  function renderKarte(){
    document.getElementById('latinWord').textContent = currentWord.lemma;
    document.getElementById('wortartTag').textContent = WA_LABELS[currentWord.waGroup] || currentWord.waGroup;
    document.getElementById('backGram').textContent = currentWord.gram || "";
    document.getElementById('backGram').style.display = (currentWord.gram && currentWord.gram !== currentWord.bed) ? 'block' : 'none';
    document.getElementById('backBed').textContent = currentWord.bed;
    document.getElementById('backKapitel').textContent =
      (currentWord.typ === "autor_cicero" || currentWord.typ === "autor_ovid") ? currentWord.autorWerk : "";
    document.getElementById('card').classList.remove('flipped');
    document.getElementById('controls').style.visibility = 'hidden';
    document.getElementById('ratePrompt').style.visibility = 'hidden';
  }

  function buildWortDistraktoren(wort){
    // bevorzugt: andere Bedeutungen derselben Wortart im aktuellen Pool
    let sameWa = pool.filter(w => w.waGroup === wort.waGroup && w.bed !== wort.bed);
    let kandidaten = sameWa.length >= 3 ? sameWa : pool.filter(w => w.bed !== wort.bed);
    const shuffled = kandidaten.slice().sort(() => Math.random()-0.5);
    const distraktoren = [];
    const seen = new Set([wort.bed]);
    for (const c of shuffled){
      if (!seen.has(c.bed)){ distraktoren.push(c.bed); seen.add(c.bed); }
      if (distraktoren.length === 3) break;
    }
    return distraktoren;
  }

  function renderMC(){
    document.getElementById('mcWord').textContent = currentWord.lemma;
    document.getElementById('mcWortartTag').textContent = WA_LABELS[currentWord.waGroup] || currentWord.waGroup;
    const options = buildWortDistraktoren(currentWord);
    options.push(currentWord.bed);
    options.sort(() => Math.random()-0.5);
    const box = document.getElementById('mcOptions');
    box.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'mc-btn';
      btn.textContent = opt;
      btn.onclick = () => handleMCAntwort(btn, opt);
      box.appendChild(btn);
    });
  }

  function handleMCAntwort(btn, gewaehlt){
    const korrekt = gewaehlt === currentWord.bed;
    document.querySelectorAll('.mc-btn').forEach(b => {
      b.disabled = true;
      if (b.textContent === currentWord.bed) b.classList.add('correct');
      else if (b === btn && !korrekt) b.classList.add('wrong');
    });
    currentWord.stage = korrekt ? Math.min(4, currentWord.stage + 1) : 0;
    progress[currentWord.id] = currentWord.stage;
    saveProgress(progress);
    dailyStats.count++;
    saveDailyStats();
    renderDailyGoal();
    renderStageBar();
    lastWordId = currentWord.id;
    setTimeout(showCard, korrekt ? 650 : 1300);
  }

  document.getElementById('card').addEventListener('click', () => {
    const card = document.getElementById('card');
    if(!card.classList.contains('flipped') && pool.length > 0){
      card.classList.add('flipped');
      document.getElementById('controls').style.visibility = 'visible';
      document.getElementById('ratePrompt').style.visibility = 'visible';
    }
  });

  function rate(delta){
    if (!currentWord) return;
    if(delta === 0) currentWord.stage = 0;
    else currentWord.stage = Math.min(4, currentWord.stage + delta);
    progress[currentWord.id] = currentWord.stage;
    saveProgress(progress);
    dailyStats.count++;
    saveDailyStats();
    renderDailyGoal();
    lastWordId = currentWord.id;
    showCard();
  }

  document.querySelectorAll('.modtab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.modtab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentMod = tab.dataset.mod;
      rebuildPool();
    });
  });

  document.querySelectorAll('.uebung-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.uebung-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentUebungsmodus = tab.dataset.modus;
      document.getElementById('kartenView').style.display = currentUebungsmodus === 'karten' ? 'block' : 'none';
      document.getElementById('mcView').style.display = currentUebungsmodus === 'mc' ? 'block' : 'none';
      showCard();
    });
  });

  document.getElementById('waFilter').addEventListener('change', (e) => {
    currentWa = e.target.value;
    rebuildPool();
  });
  document.getElementById('worstBtn').addEventListener('click', () => {
    if (worstMode) rebuildPool();
    else enterWorstMode();
  });

  document.getElementById('resetLink').addEventListener('click', (e) => {
    e.preventDefault();
    if (confirm('Wirklich den gesamten Lernfortschritt zurücksetzen?')) {
      try { localStorage.removeItem(STORAGE_KEY); } catch(err) {}
      ALL_WORDS.forEach(w => { w.stage = 0; progress[w.id] = 0; });
      rebuildPool();
    }
  });

  function initAfterLoad(){
    function loadProgress(){
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch(e) { return {}; }
    }
    progress = loadProgress();
    ALL_WORDS.forEach(w => { if (progress[w.id] !== undefined) w.stage = progress[w.id]; });

    dailyStats = loadDailyStats();
    document.getElementById('goalSelect').value = String(dailyStats.goal);
    renderDailyGoal();

    document.getElementById('totalCount').textContent =
      `${ALL_WORDS.filter(w=>w.typ==='grundwortschatz').length} Grundwortschatz-Wörter · ${ALL_WORDS.filter(w=>w.typ==='autor_cicero').length} Cicero-Wörter · ${ALL_WORDS.filter(w=>w.typ==='autor_ovid').length} Ovid-Wörter`;

    rebuildPool();
  }
  function saveProgress(p){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
    catch(e) { /* Vorschau-Umgebung ohne localStorage: stillschweigend ignorieren */ }
  }

  loadWordData();
</script>
</body>
</html>
